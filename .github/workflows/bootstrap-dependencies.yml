name: Bootstrap pinned dependencies
on:
  push:
    branches: [dev]
    paths: ['package.json', '.github/workflows/bootstrap-dependencies.yml']
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: tar -czf dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-dependencies
          path: dependencies.tgz
          retention-days: 1
